# Azure DevOps pipeline for migrating Azure Managed Grafana to self-managed Grafana Enterprise.
#
# mode=migrate : Plan (export + dry run, published for review) -> approval -> Migrate (import + validate)
# mode=cutover : approval -> unpause migrated rules on Grafana Enterprise (optionally pause them on the source)
#
# Prerequisites
#   - Variable group "grafana-migration" with SRC_URL, DST_URL and DST_TOKEN (mark DST_TOKEN as secret).
#   - An Azure Resource Manager service connection whose identity holds the Grafana Admin role on the
#     Azure Managed Grafana workspace (used to get an Entra ID token; no source token is stored).
#   - Environments "grafana-enterprise" and "grafana-cutover" with approval checks.

trigger: none
pr: none

parameters:
  - name: mode
    displayName: What to run
    type: string
    default: migrate
    values: [migrate, cutover]
  - name: folders
    displayName: Folder UIDs for this wave (space-separated; 'general' = root level; blank = everything)
    type: string
    default: ' '
  - name: overwrite
    displayName: Update resources that already exist on Grafana Enterprise
    type: boolean
    default: false
  - name: includeContactPointSecrets
    displayName: Copy contact point secrets (fetched at import time, never published)
    type: boolean
    default: false
  - name: pauseSource
    displayName: Cutover only - also pause the same rule groups on Azure Managed Grafana
    type: boolean
    default: false

variables:
  - group: grafana-migration
  - name: azureServiceConnection
    value: azmg-migration   # change to your service connection name

pool:
  vmImage: ubuntu-latest

stages:
  - ${{ if eq(parameters.mode, 'migrate') }}:
      - stage: Plan
        displayName: Export and dry run
        jobs:
          - job: plan
            steps:
              - checkout: self
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.12'
              - task: AzureCLI@2
                displayName: Export from Azure Managed Grafana (read-only)
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    python3 grafana_migrate.py export --out "$(Build.ArtifactStagingDirectory)/export"
                env:
                  SRC_AUTH: entra
                  SRC_URL: $(SRC_URL)
              - bash: |
                  set -euo pipefail
                  ARGS=()
                  for f in $FOLDERS; do ARGS+=(--folder "$f"); done
                  [ "${OVERWRITE,,}" = "true" ] && ARGS+=(--overwrite)
                  python3 grafana_migrate.py import --from "$(Build.ArtifactStagingDirectory)/export" --dry-run "${ARGS[@]}"
                displayName: Dry run against Grafana Enterprise
                env:
                  DST_URL: $(DST_URL)
                  DST_TOKEN: $(DST_TOKEN)
                  FOLDERS: ${{ parameters.folders }}
                  OVERWRITE: ${{ parameters.overwrite }}
              - publish: $(Build.ArtifactStagingDirectory)/export
                artifact: export
                displayName: Publish export and dry-run report for review

      - stage: Migrate
        displayName: Import and validate
        dependsOn: Plan
        jobs:
          - deployment: migrate
            environment: grafana-enterprise   # add an approval check here
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - task: UsePythonVersion@0
                      inputs:
                        versionSpec: '3.12'
                    - ${{ if eq(parameters.includeContactPointSecrets, true) }}:
                        - task: AzureCLI@2
                          displayName: Fetch contact point secrets into the reviewed export
                          inputs:
                            azureSubscription: $(azureServiceConnection)
                            scriptType: bash
                            scriptLocation: inlineScript
                            inlineScript: |
                              set -euo pipefail
                              TMP="$(Agent.TempDirectory)/secrets-export"
                              python3 grafana_migrate.py export --out "$TMP" --decrypt-secrets --force
                              cp "$TMP/alerting/contact-points.secrets.json" "$(Pipeline.Workspace)/export/alerting/"
                              rm -rf "$TMP"
                          env:
                            SRC_AUTH: entra
                            SRC_URL: $(SRC_URL)
                    - bash: |
                        set -euo pipefail
                        ARGS=()
                        for f in $FOLDERS; do ARGS+=(--folder "$f"); done
                        [ "${OVERWRITE,,}" = "true" ] && ARGS+=(--overwrite)
                        python3 grafana_migrate.py import --from "$(Pipeline.Workspace)/export" "${ARGS[@]}"
                      displayName: Import into Grafana Enterprise (alert rules arrive paused)
                      env:
                        DST_URL: $(DST_URL)
                        DST_TOKEN: $(DST_TOKEN)
                        FOLDERS: ${{ parameters.folders }}
                        OVERWRITE: ${{ parameters.overwrite }}
                    - bash: |
                        set -euo pipefail
                        ARGS=()
                        for f in $FOLDERS; do ARGS+=(--folder "$f"); done
                        python3 grafana_migrate.py validate --from "$(Pipeline.Workspace)/export" "${ARGS[@]}"
                      displayName: Validate
                      condition: succeededOrFailed()
                      env:
                        DST_URL: $(DST_URL)
                        DST_TOKEN: $(DST_TOKEN)
                        FOLDERS: ${{ parameters.folders }}
                    - bash: find "$(Pipeline.Workspace)/export" -name '*.secrets.json' -delete
                      displayName: Remove secrets from the agent
                      condition: always()
                    - publish: $(Pipeline.Workspace)/export/reports
                      artifact: reports
                      displayName: Publish import and validation reports
                      condition: always()

  - ${{ if eq(parameters.mode, 'cutover') }}:
      - stage: Cutover
        displayName: Activate alert rules on Grafana Enterprise
        jobs:
          - deployment: cutover
            environment: grafana-cutover   # add an approval check here
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - task: UsePythonVersion@0
                      inputs:
                        versionSpec: '3.12'
                    - task: AzureCLI@2
                      displayName: Cutover
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          EXPORT="$(Agent.TempDirectory)/export"
                          python3 grafana_migrate.py export --out "$EXPORT"
                          ARGS=()
                          for f in $FOLDERS; do ARGS+=(--folder "$f"); done
                          [ "${PAUSE_SOURCE,,}" = "true" ] && ARGS+=(--pause-source)
                          python3 grafana_migrate.py cutover --from "$EXPORT" "${ARGS[@]}"
                          mkdir -p "$(Build.ArtifactStagingDirectory)/reports"
                          cp "$EXPORT"/reports/*.json "$(Build.ArtifactStagingDirectory)/reports/"
                      env:
                        SRC_AUTH: entra
                        SRC_URL: $(SRC_URL)
                        DST_URL: $(DST_URL)
                        DST_TOKEN: $(DST_TOKEN)
                        FOLDERS: ${{ parameters.folders }}
                        PAUSE_SOURCE: ${{ parameters.pauseSource }}
                    - publish: $(Build.ArtifactStagingDirectory)/reports
                      artifact: cutover-reports
                      condition: always()
